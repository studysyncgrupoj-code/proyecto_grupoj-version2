services:
  postgres:
    image: postgres:15
    container_name: studysync-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - studysync_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - studysync_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: studysync-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    volumes:
      - studysync_pgadmin_data:/var/lib/pgadmin
    networks:
      - studysync_network

volumes:
  studysync_postgres_data:
  studysync_pgadmin_data:

networks:
  studysync_network:
    driver: bridge
