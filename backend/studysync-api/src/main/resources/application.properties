# ============================================
# PERFIL ACTIVO
# ============================================
# Por defecto arranca con el perfil "local".
# En producción, definir SPRING_PROFILES_ACTIVE=prod como variable de entorno.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ============================================
# APLICACIÓN
# ============================================
spring.application.name=studysync-api
server.port=${SERVER_PORT:8080}

# ============================================
# BASE DE DATOS (PostgreSQL)
# ============================================
# Los valores reales vienen de application-local.properties (dev)
# o de variables de entorno (prod). Aquí solo se declaran placeholders
# con default para no romper si faltan en local.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# ============================================
# JPA / HIBERNATE
# ============================================
# ddl-auto=update es cómodo en dev pero PELIGROSO en prod.
# Se sobrescribe con JPA_DDL_AUTO=validate en prod.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# NOTA: no se especifica hibernate.dialect porque Hibernate 6.x
# lo detecta automáticamente desde la URL JDBC.

# ============================================
# RESEND (envío de correos)
# ============================================
# La API key se define en application-local.properties o en prod.
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}
resend.to=${RESEND_TO:}

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.studysync=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n