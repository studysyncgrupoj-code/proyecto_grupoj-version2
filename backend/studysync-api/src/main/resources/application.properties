# ============================================
# PERFIL ACTIVO
# ============================================
# Por defecto arranca con el perfil "local".
# En producción, definir SPRING_PROFILES_ACTIVE=prod.

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# ============================================
# APLICACIÓN
# ============================================

spring.application.name=studysync-api
server.port=${SERVER_PORT:8080}


# ============================================
# BASE DE DATOS (PostgreSQL)
# ============================================
# Los valores reales vienen de
# application-local.properties (desarrollo)
# o de variables de entorno (producción).

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}


# ============================================
# JPA / HIBERNATE
# ============================================
# En producción, configurar JPA_DDL_AUTO=validate.

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate detecta automáticamente el dialecto.


# ============================================
# RESEND (ENVÍO DE CORREOS)
# ============================================
# Configuración mediante variables de entorno.

resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}
resend.to=${RESEND_TO:}


# ============================================
# REDIS
# ============================================
# En Docker, REDIS_HOST debe apuntar
# al servicio de Redis correspondiente.
# En producción, configurar los valores
# proporcionados por el proveedor.

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}


# ============================================
# FRONTEND
# ============================================
# URL utilizada para generar los enlaces
# de recuperación de contraseña.
#
# Desarrollo: http://localhost:3000
# Producción: configurar FRONTEND_URL
# con el dominio definitivo de StudySync.

app.frontend.url=${FRONTEND_URL:http://localhost:3000}


# ============================================
# LOGGING
# ============================================

logging.level.root=INFO
logging.level.com.studysync=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n